name: Game CRUD API Tests

vars:
  url: http://localhost:8080
  testGameSlug: test-game-venom

testcases:
# GET /games - List all games
- name: GET games - List all games
  steps:
  - type: http
    method: GET
    url: "{{.url}}/api/v1/games"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 200
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson ShouldNotBeNil

# GET /games/:slug - Get existing game (game may not exist in test environment)
- name: GET game by slug - Existing game
  steps:
  - type: http
    method: GET
    url: "{{.url}}/api/v1/games/rune"
    timeout: 5
    assertions:
    - result.statuscode ShouldBeGreaterThanOrEqualTo 200
    - result.statuscode ShouldBeLessThan 500
    - result.timeseconds ShouldBeLessThan 1

# GET /games/:slug - Get non-existing game
- name: GET game by slug - Non-existing game
  steps:
  - type: http
    method: GET
    url: "{{.url}}/api/v1/games/nonexistent-game-slug-12345"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 404
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson.error.code ShouldNotBeEmpty
    - result.bodyjson.error.message ShouldNotBeEmpty

# PUT /games/:slug - Create new game
- name: PUT game - Create new game
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}"
    headers:
      Content-Type: application/json
    body: |
      {
        "name": "Test Game from Venom",
        "executables": [
          {
            "role": "client",
            "path": "/usr/bin/test-game",
            "requiresadmin": false,
            "format": "string",
            "argumentseperator": " ",
            "args": [
              {
                "role": "flag",
                "name": "test-arg",
                "required": false,
                "enabled": true,
                "format": "string",
                "argument": "--test",
                "description": "Test argument",
                "orderindex": 0
              }
            ]
          }
        ]
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 201
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson.slug ShouldEqual "{{.testGameSlug}}"
    - result.bodyjson.name ShouldEqual "Test Game from Venom"

# PUT /games/:slug - Update existing game
- name: PUT game - Update existing game
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}"
    headers:
      Content-Type: application/json
    body: |
      {
        "name": "Updated Test Game from Venom",
        "executables": [
          {
            "role": "client",
            "path": "/usr/bin/test-game-updated",
            "requiresadmin": true,
            "format": "string",
            "argumentseperator": " ",
            "args": []
          }
        ]
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 202
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson.slug ShouldEqual "{{.testGameSlug}}"
    - result.bodyjson.name ShouldEqual "Updated Test Game from Venom"

# PUT /games/:slug - Invalid request (missing name)
- name: PUT game - Invalid request missing name
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-invalid"
    headers:
      Content-Type: application/json
    body: |
      {
        "executables": []
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 400
    - result.timeseconds ShouldBeLessThan 1

# PUT /games/:slug - Invalid JSON
- name: PUT game - Invalid JSON
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-invalid-json"
    headers:
      Content-Type: application/json
    body: "{ invalid json }"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 400
    - result.timeseconds ShouldBeLessThan 1

# PUT /games/:slug - Empty request body
- name: PUT game - Empty request body
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-empty-body"
    headers:
      Content-Type: application/json
    body: ""
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 400
    - result.timeseconds ShouldBeLessThan 1

# PUT /games/:slug - Verify URL slug is used (body doesn't include slug field)
- name: PUT game - Slug mismatch
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-url-slug"
    headers:
      Content-Type: application/json
    body: |
      {
        "name": "Test Game",
        "executables": []
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldBeGreaterThanOrEqualTo 201
    - result.statuscode ShouldBeLessThan 300
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson.slug ShouldEqual "{{.testGameSlug}}-url-slug"

# PUT /games/:slug - Duplicate executable roles
- name: PUT game - Duplicate executable roles
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-duplicate-roles"
    headers:
      Content-Type: application/json
    body: |
      {
        "name": "Test Game",
        "executables": [
          {
            "role": "client",
            "path": "/usr/bin/game1",
            "args": []
          },
          {
            "role": "client",
            "path": "/usr/bin/game2",
            "args": []
          }
        ]
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 400
    - result.timeseconds ShouldBeLessThan 1

# PUT /games/:slug - Empty executable role
- name: PUT game - Empty executable role
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-empty-role"
    headers:
      Content-Type: application/json
    body: |
      {
        "name": "Test Game",
        "executables": [
          {
            "role": "",
            "path": "/usr/bin/game",
            "args": []
          }
        ]
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 400
    - result.timeseconds ShouldBeLessThan 1

# PUT /games/:slug - Empty executable path
- name: PUT game - Empty executable path
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-empty-path"
    headers:
      Content-Type: application/json
    body: |
      {
        "name": "Test Game",
        "executables": [
          {
            "role": "client",
            "path": "",
            "args": []
          }
        ]
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 400
    - result.timeseconds ShouldBeLessThan 1

# PUT /games/:slug - Invalid argument order index (negative)
- name: PUT game - Invalid argument order index
  steps:
  - type: http
    method: PUT
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}-invalid-order"
    headers:
      Content-Type: application/json
    body: |
      {
        "name": "Test Game",
        "executables": [
          {
            "role": "client",
            "path": "/usr/bin/game",
            "args": [
              {
                "role": "flag",
                "name": "test-arg",
                "required": false,
                "enabled": true,
                "format": "string",
                "argument": "--test",
                "orderindex": -1
              }
            ]
          }
        ]
      }
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 400
    - result.timeseconds ShouldBeLessThan 1

# GET /games - Verify response structure
- name: GET games - Verify response structure
  steps:
  - type: http
    method: GET
    url: "{{.url}}/api/v1/games"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 200
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson ShouldNotBeEmpty
    - result.bodyjson ShouldBeArray

# GET /games/:slug - Verify updated game
- name: GET game - Verify updated game
  steps:
  - type: http
    method: GET
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 200
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson.slug ShouldEqual "{{.testGameSlug}}"
    - result.bodyjson.name ShouldEqual "Updated Test Game from Venom"

# DELETE /games/:slug - Delete game
- name: DELETE game - Delete existing game
  steps:
  - type: http
    method: DELETE
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 204
    - result.timeseconds ShouldBeLessThan 1

# GET /games/:slug - Verify game deleted
- name: GET game - Verify game deleted
  steps:
  - type: http
    method: GET
    url: "{{.url}}/api/v1/games/{{.testGameSlug}}"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 404
    - result.timeseconds ShouldBeLessThan 1

# DELETE /games/:slug - Delete non-existing game
- name: DELETE game - Delete non-existing game
  steps:
  - type: http
    method: DELETE
    url: "{{.url}}/api/v1/games/nonexistent-game-slug-12345"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 404
    - result.timeseconds ShouldBeLessThan 1

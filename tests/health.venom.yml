name: Health Check API Tests

vars:
  url: http://localhost:8080

testcases:
# GET /health - Health check endpoint
- name: GET health - Health check
  steps:
  - type: http
    method: GET
    url: "{{.url}}/health"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 200
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson.status ShouldEqual ok

# GET /health - Verify response structure
- name: GET health - Verify response structure
  steps:
  - type: http
    method: GET
    url: "{{.url}}/health"
    timeout: 5
    assertions:
    - result.statuscode ShouldEqual 200
    - result.timeseconds ShouldBeLessThan 1
    - result.bodyjson ShouldNotBeEmpty
    - result.bodyjson.status ShouldNotBeEmpty

